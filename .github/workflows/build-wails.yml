name: Build Wails EXE

on:
  push:
    tags:
      - "w*"   # 试验版(w0.x)
      - "v*"   # 正式版(v1.x)

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      # ⚠️ 顺序不能反：
      #   ① 前端 import 的 wailsjs 绑定必须已存在(仓库里提交着，新增绑定要一起提交)
      #   ② wails generate module 需要 frontend/dist 已存在(main.go embed all:frontend/dist)
      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Generate bindings
        shell: bash
        run: |
          wails generate module

      - name: Build Windows EXE
        shell: bash
        run: |
          wails build -skipbindings -clean -platform windows/amd64

      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # 提取 CHANGELOG.md 中当前版本段落(## TAG 到下一个 ##)
          BODY=$(awk -v tag="## $TAG" '
            $0 ~ tag {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ★ 版本清单：客户端免 API 检查更新用
      #   地址(永远指向最新 release): https://github.com/<repo>/releases/latest/download/latest.json
      - name: Write latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.body }}
          REPO: ${{ github.repository }}
        run: |
          python -c "import json,os;t=os.environ['TAG'];r=os.environ['REPO'];json.dump({'version':t,'notes':os.environ.get('NOTES','').strip(),'url':'https://github.com/'+r+'/releases/download/'+t+'/table-match-wails.exe'},open('latest.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          cp latest.json "$RUNNER_TEMP/latest.json"
          cat latest.json

      # ★ 把 latest.json 提交回仓库(main)：raw 路径免 API 检查更新
      #   (自建加速站只放行 download/raw，/releases/latest/... 会被 502)
      # ⚠️ 不能直接 git push HEAD:main —— 检出的是 tag(游离头)，main 可能已前进 ⇒ 非快进被拒
      #    改为：以 origin/main 为基重建分支，再覆盖 latest.json 提交
      #    continue-on-error：这步只是"便利清单"，✗ 不能因为它失败就让整个发版失败
      - name: Publish latest.json to repo
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B publishmain origin/main
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add -f latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变化"
          else
            git commit -m "chore: latest.json for ${{ github.ref_name }} [skip ci]"
            git push origin publishmain:main
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            build/bin/table-match-wails.exe
            latest.json
          fail_on_unmatched_files: false
